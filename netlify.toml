# Cómo monta Netlify esta web.
#   - el front se compila con Vite y se publica desde web/dist
#   - todo lo que empieza por /api lo atiende la función del catálogo

[build]
  command = "npm run build:netlify"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

# La función que atiende /api (catálogo, fotos y acceso del administrador)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Ojo: no pongas aquí una regla para /api/*. La función ya declara esa ruta
# (`export const config = { path: '/api/*' }`) y una redirección se le
# adelantaría, mandando la petición a una dirección que no existe.

# El front es una sola página: cualquier ruta la resuelve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

# Los ficheros compilados llevan hash en el nombre: se cachean para siempre
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"
