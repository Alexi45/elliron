# Alternativa a Caddy. El certificado se saca con:
#   sudo certbot --nginx -d elliron.es -d www.elliron.es

server {
    listen 80;
    server_name elliron.es www.elliron.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name elliron.es www.elliron.es;

    ssl_certificate     /etc/letsencrypt/live/elliron.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elliron.es/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;         # imprescindible para el estado en vivo
        proxy_read_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
